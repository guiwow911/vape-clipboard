<div id="stage">
  <div id="guiWrap">
    <div class="searchbar">
      <button class="sb-ic" id="btnImport" title="Import from system clipboard">
        <svg><use href="#i-clipin"/></svg>
      </button>

      <button class="sb-go" id="btnSearch" title="Search"><svg><use href="#i-search"/></svg></button>
    </div>

    <aside class="panel side" id="sidebar"></aside>
    <div id="panels"></div>
  </div>

  <div id="inject"></div>

  <div id="toast"></div>
</div>

<script>
window.addEventListener('error', function(e){
  var n = document.getElementById('toast');
  if (n){ n.textContent = 'JS ERROR: ' + e.message + ' @' + (e.lineno||'?'); n.classList.add('show'); }
  else { document.title = 'JS ERROR: ' + e.message; }
});
</script>
